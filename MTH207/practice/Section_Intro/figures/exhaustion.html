<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area by exhaustion</title>
<style>
 :root{--circ:#0077b6;--poly:#c1121f;--ink:#22303c;--grey:#6c757d}
 *{box-sizing:border-box}
 body{margin:0;padding:10px;font:clamp(15px,1.05vw,20px)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--ink);background:#fff}
 .wrap{width:100%;max-width:560px;margin:0 auto}
 .stage svg{width:100%;height:auto;display:block}
 /* A lightbox is wide and short. Stacked, the figure can only use
    about 60% of its width; side by side it uses nearly all of it. */
 @media (min-width:900px) and (min-aspect-ratio:13/10){
   body>.wrap{max-width:none;display:flex;align-items:center;gap:2.5vw;
          min-height:94vh}
   body>.wrap .stage{flex:1 1 auto;min-width:0;max-width:calc(90vh * 400 / 340);
           margin:0 auto}
   body>.wrap .side{flex:0 0 clamp(230px,22%,360px)}
   /* the panel is too narrow for label-beside-slider: give the slider its
      own full-width line, and keep the readout on the label's line */
   body>.wrap .ctl{margin-top:0;flex-wrap:wrap;row-gap:.4em}
   body>.wrap .ctl .stepper{flex:1 1 100%;order:3}
   body>.wrap .ctl output{order:2;margin-left:auto}
   body>.wrap .side table tr{display:block;margin-bottom:.6em}
   body>.wrap .side th,body>.wrap .side td{display:block;padding:0}
   body>.wrap .side th{font-size:.86em}
 }
 svg{width:100%;height:auto;display:block;touch-action:pan-y}
 body>.wrap .ctl{display:flex;align-items:center;gap:.7em;margin:.6em 0 .3em}
 body>.wrap .ctl label{font-weight:600;white-space:nowrap}
 input[type=range]{flex:1;min-width:0;accent-color:var(--poly)}
 /* the buttons flank the slider and travel with it when the panel wraps */
 .stepper{display:flex;align-items:center;gap:.5em;flex:1;min-width:0}
 .step{flex:0 0 auto;width:2.1em;height:2.1em;min-width:34px;min-height:34px;
       display:flex;align-items:center;justify-content:center;
       font:inherit;font-size:1.1em;font-weight:700;line-height:1;
       color:var(--poly);background:#fff;border:2px solid var(--poly);
       border-radius:6px;cursor:pointer;padding:0;
       -webkit-tap-highlight-color:transparent}
 .step:hover:not(:disabled){background:var(--poly);color:#fff}
 .step:active:not(:disabled){transform:translateY(1px)}
 .step:focus-visible{outline:3px solid var(--circ);outline-offset:2px}
 .step:disabled{opacity:.32;cursor:default}
 @media (prefers-reduced-motion:reduce){.step:active{transform:none}}
 table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
 caption{text-align:left;font-weight:600;padding-bottom:.3em}
 th,td{text-align:left;padding:.22em .5em .22em 0}
 th{font-weight:600;color:var(--grey)}
 .poly{color:var(--poly);font-weight:700}.circ{color:var(--circ);font-weight:700}
 .note{color:var(--grey);font-size:.86em;margin:.5em 0 0}
</style></head><body><div class="wrap">
<div class="stage"><svg id="v" viewBox="0 0 400 340" role="img"
     aria-label="A circle of radius 1 with a regular polygon inscribed in it. Faint lines run from the centre to each corner, splitting the polygon into identical triangles. A slider raises the number of sides, and the polygon's area climbs toward the area of the circle, pi.">
  <circle cx="200" cy="165" r="150" fill="none" stroke="var(--circ)" stroke-width="3"/>
  <polygon id="poly" fill="rgba(193,18,31,.13)" stroke="var(--poly)" stroke-width="2.5"/>
  <!-- radii to each vertex: makes the n-triangle decomposition visible, which is
       how you get an area formula. Faded as n grows so 96 spokes do not become
       a solid disc. -->
  <g id="spokes" stroke="var(--ink)" stroke-width="1"></g>
  <circle cx="200" cy="165" r="3.5" fill="var(--ink)"/>
  <line x1="200" y1="165" x2="350" y2="165" stroke="var(--ink)" stroke-width="1.4"/>
  <text x="272" y="152" font-size="14" fill="var(--ink)" text-anchor="middle"
        paint-order="stroke" stroke="#fff" stroke-width="4"
        stroke-linejoin="round">r = 1</text>
</svg></div>
<div class="side"><div class="ctl"><label for="n">Sides</label>
  <div class="stepper">
    <button type="button" class="step" id="dec" aria-label="One fewer side">&minus;</button>
    <input id="n" type="range" min="3" max="96" step="1" value="3" aria-describedby="out">
    <button type="button" class="step" id="inc" aria-label="One more side">+</button>
  </div>
  <output id="nv" style="font-weight:700;min-width:2.4em;text-align:right">3</output></div>
<table id="out"><caption>Inscribed polygon vs. the circle</caption>
 <tr><th scope="row">area of the polygon</th><td class="poly" id="ap"></td></tr>
 <tr><th scope="row">area of the circle</th><td class="circ">&pi; = 3.14159265&hellip;</td></tr>
 <tr><th scope="row">still missing</th><td id="gap"></td></tr>
</table>
<p class="note" id="arch">Archimedes did this by hand and stopped at 96 sides.</p></div>
</div>
<script>
(function(){
 var CX=200,CY=165,R=150,el=function(i){return document.getElementById(i)};
 function draw(){
  var n=+el('n').value, pts=[];
  for(var k=0;k<n;k++){
    // start at the top so the polygon looks deliberate rather than tilted
    var th=-Math.PI/2+2*Math.PI*k/n;
    pts.push((CX+R*Math.cos(th)).toFixed(2)+','+(CY+R*Math.sin(th)).toFixed(2));
  }
  el('poly').setAttribute('points',pts.join(' '));
  // one radius per vertex. Opacity falls as n rises: at n=3..8 the triangles are
  // the whole point, by n=96 they would just fill the circle in.
  var sp='';
  for(var j=0;j<n;j++){
    var a2=-Math.PI/2+2*Math.PI*j/n;
    sp+='<line x1="'+CX+'" y1="'+CY+'" x2="'+(CX+R*Math.cos(a2)).toFixed(2)
      +'" y2="'+(CY+R*Math.sin(a2)).toFixed(2)+'"/>';
  }
  el('spokes').innerHTML=sp;
  el('spokes').setAttribute('opacity',
  n > 40 ? '0' : Math.min(0.45, 4/n).toFixed(3));
  var A=n/2*Math.sin(2*Math.PI/n);          // area of a unit-radius n-gon
  el('nv').textContent=n;
  el('ap').textContent=A.toFixed(6);
  el('gap').textContent=(Math.PI-A).toFixed(6);
  el('arch').textContent = n>=96
    ? 'Archimedes got this far by hand — 96 sides, no calculator.'
    : 'Archimedes did this by hand and stopped at 96 sides.';
  el('dec').disabled = n <= +el('n').min;
  el('inc').disabled = n >= +el('n').max;
 }
 // +/- move one side at a time, for stepping through 3, 4, 5, 6 at the start
 // where each new side changes the picture a lot. Clamped to the slider's
 // own range so the two controls can never disagree.
 function step(d){
  var i=el('n'), v=Math.min(+i.max, Math.max(+i.min, (+i.value)+d));
  if(v!==+i.value){ i.value=v; draw(); }
 }
 el('dec').addEventListener('click',function(){step(-1)});
 el('inc').addEventListener('click',function(){step(1)});
 el('n').addEventListener('input',draw);draw();
})();
</script></body></html>
