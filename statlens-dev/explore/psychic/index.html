<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Are You Psychic? | StatLens</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/style.css">
    <meta name="theme-color" content="#569BBD">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="../../manifest.json">
    <link rel="apple-touch-icon" href="../../icon-192.png">

    <style>
    /* ── Layout ─────────────────────────────────────────────────────── */
    .psychic-app {
      max-width: 640px;
      margin: 0 auto;
      padding: 1rem;
    }
    .intro-text {
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    /* ── Coin ───────────────────────────────────────────────────────── */
    .coin-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      margin: 1rem 0;
      perspective: 600px;
    }
    .coin {
      width: 140px;
      height: 140px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }
    .coin.flipping {
      animation: coin-flip 0.8s ease-in-out;
    }
    .coin.show-tails {
      transform: rotateY(180deg);
    }
    .coin.show-heads {
      transform: rotateY(0deg);
    }
    @keyframes coin-flip {
      0%   { transform: rotateY(0deg)   translateY(0); }
      30%  { transform: rotateY(540deg)  translateY(-60px); }
      60%  { transform: rotateY(1080deg) translateY(-30px); }
      80%  { transform: rotateY(1440deg) translateY(0); }
      100% { transform: rotateY(var(--final-rotation)) translateY(0); }
    }
    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      /* Coin appearance */
      background: radial-gradient(circle at 35% 35%, #f0d060, #c8a020 60%, #a07810 100%);
      border: 4px solid #a08030;
      box-shadow:
        0 2px 8px rgba(0,0,0,0.3),
        inset 0 1px 2px rgba(255,255,200,0.4);
    }
    .coin-face.heads {
      /* Front face — no extra transform needed */
    }
    .coin-face.tails {
      transform: rotateY(180deg);
    }
    .coin-label {
      font-size: 2.8rem;
      font-weight: 700;
      color: #6b4e10;
      text-shadow: 0 1px 1px rgba(255,255,200,0.5);
      user-select: none;
      font-family: 'Georgia', serif;
    }
    .coin-sublabel {
      font-size: 0.7rem;
      color: #7a5e20;
      position: absolute;
      bottom: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Prediction buttons ────────────────────────────────────────── */
    .predict-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .predict-btn {
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.7rem 2rem;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background: white;
      color: var(--accent);
      cursor: pointer;
      min-width: 120px;
      transition: background 0.15s, color 0.15s;
    }
    .predict-btn:hover, .predict-btn:focus-visible {
      background: var(--accent);
      color: white;
    }
    .predict-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .finish-btn {
      font-size: 0.95rem;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      border: 2px solid #888;
      background: white;
      color: #555;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .finish-btn:hover, .finish-btn:focus-visible {
      background: #555;
      color: white;
    }
    .finish-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Progress ───────────────────────────────────────────────────── */
    .progress-bar {
      font-size: 0.95rem;
      text-align: center;
      margin: 0.5rem 0;
      color: #555;
    }

    /* ── Trial tracker ─────────────────────────────────────────────── */
    .trial-tracker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin: 1rem 0;
      min-height: 40px;
    }
    .trial-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      border: 2px solid #ccc;
      background: #f5f5f5;
      color: #999;
      transition: all 0.3s;
    }
    .trial-dot.correct {
      border-color: #009E73;
      background: #e6f7f1;
      color: #009E73;
    }
    .trial-dot.incorrect {
      border-color: #D55E00;
      background: #fef0e8;
      color: #D55E00;
    }
    .trial-dot.pending {
      border-style: dashed;
    }

    /* ── Summary ────────────────────────────────────────────────────── */
    .summary-panel {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: center;
    }
    .summary-panel h3 {
      margin-top: 0;
    }
    .summary-score {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0.5rem 0;
    }
    .summary-interp {
      color: #555;
      line-height: 1.5;
      margin: 0.75rem 0;
    }
    .sim-link-btn {
      display: inline-block;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      text-decoration: none;
      margin-top: 0.75rem;
      transition: opacity 0.15s;
    }
    .sim-link-btn:hover, .sim-link-btn:focus-visible {
      opacity: 0.85;
    }
    .restart-btn {
      display: inline-block;
      font-size: 0.9rem;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      border: 2px solid #888;
      background: white;
      color: #555;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s, color 0.15s;
    }
    .restart-btn:hover, .restart-btn:focus-visible {
      background: #555;
      color: white;
    }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .coin { width: 110px; height: 110px; }
      .coin-label { font-size: 2.2rem; }
      .coin-stage { height: 160px; }
      .predict-btn { padding: 0.6rem 1.5rem; min-width: 100px; }
    }

    /* ── Reduced motion ─────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .coin.flipping { animation: none; }
      .trial-dot { transition: none; }
    }

    /* ── Screen reader ──────────────────────────────────────────────── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); border: 0;
    }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../../">StatLens</a> &rsaquo;
        <a href="../">Explore</a> &rsaquo;
        <span aria-current="page">Are You Psychic?</span>
    </nav>

    <main id="main" class="psychic-app">
        <h1>Are You Psychic?</h1>

        <div class="intro-text">
            <p>Can you predict the outcome of a coin flip? Make your predictions below
            and we'll see how you do. If you're just guessing, you'd expect to get
            about half right.</p>
        </div>

        <div class="progress-bar" id="progress" aria-live="polite">
            Trial <span id="trial-num">1</span> of <span id="trial-total">16</span>
        </div>

        <div class="coin-stage" aria-hidden="true">
            <div class="coin" id="coin">
                <div class="coin-face heads">
                    <span class="coin-label">H</span>
                    <span class="coin-sublabel">Heads</span>
                </div>
                <div class="coin-face tails">
                    <span class="coin-label">T</span>
                    <span class="coin-sublabel">Tails</span>
                </div>
            </div>
        </div>

        <div class="predict-controls" id="controls">
            <button class="predict-btn" id="btn-heads" data-guess="heads">Heads</button>
            <button class="predict-btn" id="btn-tails" data-guess="tails">Tails</button>
        </div>

        <div id="finish-row" style="text-align:center; margin: 0.5rem 0;" hidden>
            <button class="finish-btn" id="btn-finish">Finish remaining trials</button>
        </div>

        <div class="trial-tracker" id="tracker" role="list" aria-label="Trial results">
        </div>

        <div id="summary" class="summary-panel" hidden>
        </div>

        <div id="sr-announce" class="sr-only" aria-live="polite"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
