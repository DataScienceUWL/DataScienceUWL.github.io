  <text x="30" y="125" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" letter-spacing="4">DATA</text>
  <text x="410" y="132" fill="#16B9BE" font-family="Georgia, Times New Roman, serif" font-size="151" font-weight="700">@</text>
  <text x="555" y="125" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" letter-spacing="4">UWL</text>
  <rect x="34" y="165" width="820" height="9" fill="#16B9BE"/>
  <text x="35" y="223" fill="#4B5F70" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">REAL-WORLD DATA TALKS</text>
