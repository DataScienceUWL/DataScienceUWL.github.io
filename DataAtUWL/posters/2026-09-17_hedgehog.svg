<?xml version="1.0" encoding="UTF-8"?>
<!-- Self-contained, letter-size final poster. 2550 × 3300 px = 8.5 × 11 in at 300 ppi. -->
<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 2550 3300" role="img" aria-labelledby="title desc">
  <title id="title">Data at UWL: Quills, Thrills and Power Bills: Hertz the Power Hedgehog</title>
  <desc id="desc">Poster for a September 17, 2026 Data at UWL talk by David Elzinga and Claire Nordt of Dairyland Power Cooperative.</desc>
  <rect width="2550" height="3300" fill="#FFFDFC"/>

  <!-- Header: compact wordmark, deliberately free of decorative red marks. -->
  <rect x="0" y="0" width="2550" height="715" fill="#830019"/>
  <rect x="0" y="715" width="2550" height="24" fill="#00838F"/>
  <text x="190" y="236" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="5">DATA</text>
  <text x="488" y="242" fill="#D5F9F9" font-family="Georgia, Times New Roman, serif" font-size="128" font-weight="700">@</text>
  <text x="613" y="236" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="5">UWL</text>
  <rect x="194" y="282" width="605" height="8" fill="#D5F9F9"/>
  <text x="190" y="414" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="63">What people actually do with data.</text>
  <text x="190" y="497" fill="#F2F2F3" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4">TALKS FOR UWL STUDENTS  •  MATHEMATICS &amp; STATISTICS</text>
  <text x="2360" y="165" text-anchor="end" fill="#D5F9F9" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" letter-spacing="4">FALL 2026 / TALK 01</text>
  <text x="2360" y="235" text-anchor="end" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">SEPTEMBER 17 · 4–5 PM</text>
  <line x1="190" y1="564" x2="2360" y2="564" stroke="#A8566A" stroke-width="3"/>
  <text x="190" y="632" fill="#F2F2F3" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" letter-spacing="1">Statistics and data science at UWL — research, methods, applications, and careers.</text>

  <!-- Event title and speakers -->
  <rect x="176" y="856" width="16" height="1410" fill="#830019"/>
  <text x="230" y="930" fill="#830019" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing="4">FEATURED TALK  /  01</text>
  <text x="230" y="1085" fill="#282A2E" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-2">QUILLS, THRILLS</text>
  <text x="230" y="1208" fill="#282A2E" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" letter-spacing="-2">&amp; POWER BILLS:</text>
  <text x="230" y="1350" fill="#00838F" font-family="Arial, Helvetica, sans-serif" font-size="111" font-weight="800" letter-spacing="-3">HERTZ THE</text>
  <text x="230" y="1476" fill="#00838F" font-family="Arial, Helvetica, sans-serif" font-size="111" font-weight="800" letter-spacing="-3">POWER HEDGEHOG</text>
  <line x1="230" y1="1545" x2="2360" y2="1545" stroke="#D8D9DA" stroke-width="8"/>
  <text x="230" y="1640" fill="#282A2E" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">David Elzinga &amp; Claire Nordt</text>
  <text x="230" y="1712" fill="#404143" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="1">DAIRYLAND POWER COOPERATIVE</text>

  <!-- A smaller, cleaner data visual: one chart, one purpose. -->
  <g transform="translate(1825 930)">
    <text x="0" y="0" fill="#830019" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="4">POWER SYSTEMS</text>
    <line x1="0" y1="58" x2="505" y2="58" stroke="#D8D9DA" stroke-width="4"/>
    <line x1="0" y1="285" x2="505" y2="285" stroke="#D8D9DA" stroke-width="5"/>
    <line x1="0" y1="82" x2="0" y2="285" stroke="#D8D9DA" stroke-width="5"/>
    <path d="M0 252 C65 239 102 215 156 229 C219 244 257 166 320 179 C382 192 415 118 505 91" fill="none" stroke="#00838F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#282A2E"><circle cx="0" cy="252" r="12"/><circle cx="156" cy="229" r="12"/><circle cx="320" cy="179" r="12"/><circle cx="505" cy="91" r="12"/></g>
    <text x="0" y="354" fill="#404143" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400">Pricing · forecasting · operations</text>
    <rect x="0" y="408" width="505" height="70" fill="#282A2E"/>
    <text x="252" y="454" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="2">3 PAID INTERNSHIPS</text>
  </g>

  <!-- Abstract: retained in full as a distinct, easy-to-scan panel. -->
  <rect x="230" y="1808" width="2100" height="510" rx="22" fill="#D5F9F9"/>
  <rect x="230" y="1808" width="28" height="510" rx="14" fill="#00838F"/>
  <text x="302" y="1888" fill="#282A2E" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="4">IN THE TALK</text>
  <text x="302" y="1965" fill="#282A2E" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400">
    <tspan x="302" dy="0">Dairyland Power Cooperative supplies wholesale electricity to member cooperatives</tspan>
    <tspan x="302" dy="54">serving approximately 800,000 people across Wisconsin, Minnesota, Iowa, and Illinois.</tspan>
    <tspan x="302" dy="54">We’ll explore how quantitative tools support day-to-day work and take a high-level look</tspan>
    <tspan x="302" dy="54">at Hedgehog, one of Dairyland’s pricing models. We’ll also spotlight three paid internships.</tspan>
  </text>

  <!-- Schedule and place: retained. -->
  <text x="230" y="2478" fill="#830019" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="4">SAVE YOUR SEAT</text>
  <text x="230" y="2604" fill="#282A2E" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="800">THU · SEP 17 · 4–5 PM</text>
  <text x="230" y="2695" fill="#282A2E" font-family="Georgia, Times New Roman, serif" font-size="60" font-weight="700">Centennial Hall 1404</text>
  <text x="230" y="2762" fill="#404143" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400">University of Wisconsin–La Crosse  •  Free and open to UWL students</text>

  <rect x="0" y="2934" width="2550" height="366" fill="#830019"/>
  <rect x="190" y="3008" width="66" height="8" fill="#D5F9F9"/>
  <text x="190" y="3086" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" letter-spacing="2">DATA @ UWL</text>
  <text x="190" y="3153" fill="#F2F2F3" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="400">A recurring series on statistics and data science at UW–La Crosse.</text>
  <text x="190" y="3223" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="2">MATHEMATICS &amp; STATISTICS DEPARTMENT</text>
  <text x="2358" y="3090" text-anchor="end" fill="#D5F9F9" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" letter-spacing="3">FALL 2026</text>
  <text x="2358" y="3160" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="43">Questions into evidence.</text>



