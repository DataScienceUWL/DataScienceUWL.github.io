  <!-- Condensed blurb. The full abstract lives on the website. -->
  <rect x="190" y="2110" width="2170" height="540" fill="#EAF7F7"/>
  <text x="262" y="2206" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" letter-spacing="5">IN THE TALK</text>
  <text x="262" y="2300" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="400">Dairyland Power Cooperative supplies wholesale electricity to co-ops serving</text>
  <text x="262" y="2372" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="400">about 800,000 people across Wisconsin, Minnesota, Iowa and Illinois. We’ll</text>
  <text x="262" y="2444" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="400">show how quantitative tools support day-to-day work, take a high-level look</text>
  <text x="262" y="2516" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="400">at Hedgehog — one of our pricing models — and spotlight three paid</text>
  <text x="262" y="2588" fill="#0B2342" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="400">internships currently open at Dairyland.</text>

