<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded square background in deep teal -->
  <rect x="1" y="1" width="30" height="30" rx="6" ry="6" fill="#114B5F"/>
  <!-- Open book shape in white -->
  <path d="M16 8 L16 25" stroke="white" stroke-width="1.2"/>
  <!-- Left page -->
  <path d="M6 9 Q6 7, 10 7 L16 8 L16 25 L10 24 Q6 24, 6 22 Z" fill="white" opacity="0.9"/>
  <!-- Right page -->
  <path d="M26 9 Q26 7, 22 7 L16 8 L16 25 L22 24 Q26 24, 26 22 Z" fill="white" opacity="0.75"/>
  <!-- Text lines on left page -->
  <line x1="8" y1="12" x2="14" y2="12.5" stroke="#114B5F" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="8" y1="15" x2="14" y2="15.5" stroke="#114B5F" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="8" y1="18" x2="13" y2="18.5" stroke="#114B5F" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Mini bar chart on right page -->
  <rect x="19" y="17" width="2" height="5" fill="#569BBD" rx="0.5"/>
  <rect x="22" y="14" width="2" height="8" fill="#569BBD" rx="0.5"/>
</svg>
