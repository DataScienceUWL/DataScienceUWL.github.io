<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name=robots content="noindex,nofollow">
<meta name=theme-color content="#101216">
<link rel=manifest href="./manifest.webmanifest">
<link rel=apple-touch-icon href="./icon-192.png">
<title>MOM Review</title>
<script>window.MathJax={tex:{inlineMath:[['$','$']]}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{--bg:#14161a;--card:#1e2127;--ink:#e8eaed;--mut:#9aa0a6;--line:#2c2f36;--accent:#3a7bd5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;background:#101216;border-bottom:1px solid var(--line);
padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;z-index:6}
header .t{font-weight:700;font-size:17px}header .sp{flex:1}
header button,header a.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);
padding:7px 11px;border-radius:18px;font-size:13px;font-weight:700}
.wrap{padding:12px 14px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
border-radius:14px;padding:14px 16px;margin:8px 0}
.row .grow{flex:1;min-width:0}.row .big{font-size:17px;font-weight:600}
.row .sub{color:var(--mut);font-size:13px;margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.count{background:var(--line);color:var(--ink);border-radius:20px;padding:3px 11px;font-weight:700;font-size:14px}
.nav{display:flex;align-items:center;gap:8px;position:sticky;top:54px;background:var(--bg);padding:8px 0;z-index:4}
.nav a,.nav .dis{flex:1;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line);
background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.nav .dis{background:var(--card);color:#55585f}
.nav .pos{flex:0 0 auto;color:var(--mut);font-size:13px;font-weight:700;min-width:54px;text-align:center}
.tabs{display:flex;gap:8px;position:sticky;top:107px;background:var(--bg);padding:8px 0;z-index:4}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);
background:var(--card);color:var(--mut);font-weight:700;font-size:15px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pane{display:none}.pane.on{display:block}
.shot{width:100%;border-radius:12px;border:1px solid var(--line);margin:4px 0;background:#fff}
.orig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 16px;font-size:15px}
.orig img{max-width:100%}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.item.done{opacity:.5}
.item .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.item .body{font-size:15px}.item .sug{margin-top:10px;padding:10px 12px;background:#191c22;
border-left:3px solid var(--accent);border-radius:8px;font-size:14px;color:#d2d6db}
.note{width:100%;margin-top:12px;background:#0e1014;color:var(--ink);border:1px solid var(--line);
border-radius:10px;padding:11px;font:15px/1.45 inherit;min-height:64px;resize:vertical}
.note:focus{outline:none;border-color:var(--accent)}
.toggle{margin-top:10px;display:flex;align-items:center;justify-content:center;padding:11px;
border-radius:12px;border:1px solid var(--line);background:#191c22;font-weight:700;font-size:15px;user-select:none}
.toggle.on{background:#1f3a24;border-color:#2e7d3a;color:#8fe0a0}
.muted{color:var(--mut);font-size:13px}.crumb{color:var(--mut);font-size:13px;margin:2px 0 10px}
.bar{display:flex;gap:8px;margin:6px 0 12px}
.bar button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);
color:var(--ink);font-weight:700;font-size:14px}
.bar button.go{background:#1f3a24;border-color:#2e7d3a;color:#8fe0a0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 16px;
width:100%;max-height:82vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet .mh{font-weight:700;font-size:16px}
.sheet button,.sheet .dlbtn{padding:14px;border-radius:12px;border:1px solid var(--line);
background:var(--accent);color:#fff;font-weight:700;font-size:15px;text-align:center;display:block}
.sheet button.alt{background:var(--card);color:var(--ink)}
.sheet button.cancel{background:transparent;color:var(--mut);border-color:transparent}
.sheet textarea{width:100%;height:120px;background:#0e1014;color:var(--mut);border:1px solid var(--line);
border-radius:8px;padding:8px;font:12px/1.4 monospace}
</style></head><body>
<header><a href="#/" class="t">📋 MOM Review</a><span class=sp></span>
<a class=btn href="#/priority">★ Priority</a>
<button onclick="exportNotes()">⤓ Export</button></header>
<div class=wrap id=app>Loading…</div>
<script src="./app.js"></script>
</body></html>
