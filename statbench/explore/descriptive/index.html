<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Descriptive Statistics | StatBench</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/style.css">
    <meta name="theme-color" content="#569BBD">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">

    <script type="importmap">
    {
        "imports": {
            "d3-array":     "https://cdn.jsdelivr.net/npm/d3-array@3/+esm",
            "d3-scale":     "https://cdn.jsdelivr.net/npm/d3-scale@4/+esm",
            "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@3/+esm",
            "d3-axis":      "https://cdn.jsdelivr.net/npm/d3-axis@3/+esm",
            "d3-shape":     "https://cdn.jsdelivr.net/npm/d3-shape@3/+esm"
        }
    }
    </script>

    <style>
        /* Descriptive stats page overrides */
        .var-type-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 0.75rem;
        }
        .var-type-toggle button {
            flex: 1;
            padding: 0.5rem 1rem;
            border: 2px solid var(--accent);
            background: var(--bg);
            color: var(--accent);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .var-type-toggle button:first-child {
            border-radius: 6px 0 0 6px;
            border-right: 1px solid var(--accent);
        }
        .var-type-toggle button:last-child {
            border-radius: 0 6px 6px 0;
            border-left: 1px solid var(--accent);
        }
        .var-type-toggle button[aria-pressed="true"] {
            background: var(--accent);
            color: #fff;
        }
        .var-type-toggle button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        #variable-selector {
            margin-bottom: 0.5rem;
        }
        #variable-selector label {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
        }
        #variable-selector select {
            width: auto;
        }
        #chart-area svg {
            font-family: var(--font-body);
            font-size: var(--font-size-chart);
        }
        #bin-count {
            width: 3.5rem;
            padding: 0.15rem 0.3rem;
            font-size: 0.85rem;
        }
        .summary-entry {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }
        .summary-entry .summary-row {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        .summary-entry input[type="text"] {
            flex: 1;
            min-width: 4rem;
        }
        .summary-entry input[type="number"] {
            width: 5rem;
        }
        .summary-entry .remove-row {
            background: none;
            border: none;
            color: var(--ims-gray-text);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.2rem;
            line-height: 1;
        }
    </style>
</head>
<body>
    <nav class="skip-links" aria-label="Skip links">
        <a href="#data-panel">Skip to Data</a>
        <a href="#stats-section">Skip to Statistics</a>
        <a href="#charts-section">Skip to Charts</a>
    </nav>

    <header>
        <nav aria-label="Navigation">
            <a class="home-link" href="../../">
                <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M10 2L2 9h3v7h4v-5h2v5h4V9h3L10 2z"/></svg>
                StatBench
            </a>
        </nav>
    </header>

    <main>
        <h1>Descriptive Statistics</h1>

        <div class="var-type-toggle" role="group" aria-label="Variable type">
            <button type="button" id="mode-quantitative" aria-pressed="true">Quantitative</button>
            <button type="button" id="mode-categorical" aria-pressed="false">Categorical</button>
        </div>

        <section id="data-panel" aria-label="Data input">
            <div role="tablist" aria-label="Data source">
                <button role="tab" id="tab-dataset" aria-selected="true"
                        aria-controls="panel-dataset">Datasets</button>
                <button role="tab" id="tab-paste" aria-selected="false"
                        aria-controls="panel-paste">Edit Data</button>
                <button role="tab" id="tab-file" aria-selected="false"
                    aria-controls="panel-file">Open File</button>
            </div>

            <div role="tabpanel" id="panel-dataset" aria-labelledby="tab-dataset">
                <label for="dataset-select">Choose a dataset:
                    <select id="dataset-select">
                        <option value="">-- Select --</option>
                    </select>
                </label>
                <p id="dataset-desc" class="hint"></p>
            </div>

            <div role="tabpanel" id="panel-paste" aria-labelledby="tab-paste" hidden>
                <div id="paste-quantitative">
                    <label for="paste-area">Edit or paste data (one value per line, or CSV with headers):
                        <textarea id="paste-area" rows="6"
                                  placeholder="23.1&#10;19.4&#10;27.8&#10;22.0"></textarea>
                    </label>
                </div>
                <div id="paste-categorical" hidden>
                    <p class="hint" style="margin:0 0 0.4rem;">Enter category names (one per line), or summary counts:</p>
                    <label for="paste-area-cat">Raw category values (one per line or CSV):
                        <textarea id="paste-area-cat" rows="4"
                                  placeholder="red&#10;blue&#10;red&#10;green&#10;blue&#10;red"></textarea>
                    </label>
                    <details style="margin-top:0.5rem;">
                        <summary style="font-size:0.85rem;cursor:pointer;">Or enter summary counts</summary>
                        <div id="summary-entry" class="summary-entry" aria-label="Summary data entry">
                            <div class="summary-row">
                                <input type="text" placeholder="Category" aria-label="Category name">
                                <input type="number" placeholder="Count" min="0" aria-label="Count">
                                <button type="button" class="remove-row" aria-label="Remove row">&times;</button>
                            </div>
                            <div class="summary-row">
                                <input type="text" placeholder="Category" aria-label="Category name">
                                <input type="number" placeholder="Count" min="0" aria-label="Count">
                                <button type="button" class="remove-row" aria-label="Remove row">&times;</button>
                            </div>
                        </div>
                        <button type="button" id="add-summary-row" class="btn-secondary" style="margin-top:0.3rem;font-size:0.8rem;">+ Add category</button>
                    </details>
                </div>
                <div class="btn-row">
                    <button type="button" id="load-pasted">Apply</button>
                    <button type="button" id="save-btn" class="btn-secondary">Save</button>
                    <button type="button" id="clear-btn" class="btn-secondary">Clear</button>
                </div>
            </div>

            <div role="tabpanel" id="panel-file" aria-labelledby="tab-file" hidden>
                <label for="file-input">Open a CSV or TSV file:
                    <input type="file" id="file-input" accept=".csv,.tsv,.txt">
                </label>
            </div>

            <div id="data-preview" hidden>
                <output id="data-summary"></output>
            </div>
        </section>

        <div id="variable-selector" hidden>
            <label for="var-select">Variable:
                <select id="var-select"></select>
            </label>
        </div>

        <section id="results-section" aria-label="Charts and statistics" hidden>
            <div class="app-body">
                <!-- Left: Chart area -->
                <div class="app-main">
                    <div class="chart-selector" role="radiogroup" aria-label="Chart type">
                        <label><input type="radio" name="chart-type" value="histogram" checked> Histogram</label>
                        <label><input type="radio" name="chart-type" value="dotplot"> Dotplot</label>
                        <label><input type="radio" name="chart-type" value="boxplot"> Boxplot</label>
                    </div>
                    <div class="chart-controls-bar" id="chart-controls">
                        <!-- Contextual controls injected by JS -->
                    </div>
                    <div id="chart-area"></div>
                </div>

                <!-- Right: Summary statistics sidebar -->
                <div class="app-sidebar" id="stats-sidebar">
                    <div id="numeric-stats">
                        <h2 style="font-size:1rem; margin:0;">Summary Statistics</h2>
                        <table class="sidebar-stats" aria-label="Descriptive statistics">
                            <tbody>
                                <tr><th scope="row">n</th><td id="stat-n">&mdash;</td></tr>
                                <tr class="stat-sep"><th scope="row">Mean</th><td id="stat-mean">&mdash;</td></tr>
                                <tr><th scope="row">Std Dev</th><td id="stat-sd">&mdash;</td></tr>
                                <tr class="stat-sep"><th scope="row">Min</th><td id="stat-min">&mdash;</td></tr>
                                <tr><th scope="row">Q1</th><td id="stat-q1">&mdash;</td></tr>
                                <tr><th scope="row">Median</th><td id="stat-median">&mdash;</td></tr>
                                <tr><th scope="row">Q3</th><td id="stat-q3">&mdash;</td></tr>
                                <tr><th scope="row">Max</th><td id="stat-max">&mdash;</td></tr>
                                <tr class="stat-sep"><th scope="row">IQR</th><td id="stat-iqr">&mdash;</td></tr>
                                <tr><th scope="row">Range</th><td id="stat-range">&mdash;</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="categorical-stats" hidden>
                        <h2 style="font-size:1rem; margin:0;">Frequency Table</h2>
                        <div id="freq-table-container"></div>
                    </div>
                </div>
            </div>
        </section>

        <div id="sr-announce" role="status" aria-live="polite"
             aria-atomic="true" class="sr-only"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
